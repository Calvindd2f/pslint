name: PSCI
permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        shell: [pwsh, powershell]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: PowerShell Module Cache
        uses: microsoft/setup-powershell@v2
        with:
          powershell-version: latest

      - name: Restore PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          $modules = @('PSScriptAnalyzer', 'Pester')
          foreach ($module in $modules) {
            if (-not (Get-Module -ListAvailable -Name $module)) {
              Install-Module -Name $module -Force -SkipPublisherCheck
            }
          }
    
      - name: Build PowerShell Module (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./build.ps1

      - name: Build PowerShell Module (powershell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./build.ps1

      - name: Run pslint self-check (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Import-Module ./dist/pslint/pslint.psd1
          pslint -ScriptBlock { Write-Host "CI test" } -BenchmarkMode -OutputFormat JSON

      - name: Run pslint self-check (powershell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Import-Module ./dist/pslint/pslint.psd1
          pslint -ScriptBlock { Write-Host "CI test" } -BenchmarkMode -OutputFormat JSON

      - name: Run PSScriptAnalyzer
        id: _e0a3d4e558104409b61a28bba331e88a
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          recurse: $true
          customRulePath: .github/workflows/PSScriptAnalyzerSettings.psd1

      - name: Publish PowerShell Module to PowerShellGallery
        id: _38ad555c65014b818d792b3b7abd1b2b
        uses: mod-posh/PublishPowerShellModule@v0.0.1.0
        with:
          ModuleName: 'pslint'
          Output: 'dist/pslint'
          ApiKey: ${{ secrets.NUGETAPIKEY }}
          Debug: 'true'
